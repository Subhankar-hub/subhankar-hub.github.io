# ~/.tmux.conf — Vim-friendly tmux
# Prefix is Ctrl-b (tmux default). Press Prefix, then the key below.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
setw -g aggressive-resize on

# Reload this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits that match Vim: | vertical, - horizontal  (stay in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Prefix + h/j/k/l to move between panes (Vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix + Ctrl-h/l to switch windows
bind -r C-h previous-window
bind -r C-l next-window

# Copy mode uses Vim keys; v to start selection, y to copy
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Seamless Ctrl-h/j/k/l between Vim splits and tmux panes
# (requires christoomey/vim-tmux-navigator in ~/.vimrc)
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Restore clear-screen (Ctrl-l is used for pane movement)
bind C-l send-keys 'C-l'

# Status line
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 40
set -g status-left " #[fg=#b8bb26]#S #[fg=#928374]| "
set -g status-right "#[fg=#83a598]%Y-%m-%d  %H:%M "
setw -g window-status-current-style "fg=#282828,bg=#fabd2f,bold"
setw -g window-status-style "fg=#a89984"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
